# pi4-nas Hyprland config: static/.config/hypr/hyprland.conf adapted for the Raspberry Pi 4.
# Installed as /etc/hypr/hyprland.conf and launched via `start-hyprland -- --config ...` from
# the tty1 login (see configuration.nix). To customize: copy it to ~/.config/hypr/hyprland.conf;
# the launcher prefers that file when it exists. Lines changed for the Pi are marked "pi4:".

# pi4: HDMI monitor at native res, scale 1 (laptop has eDP-1 at 2x)
monitor = , preferred, auto, 1
# monitor=eDP-1,highres,auto,2

general {
  gaps_in = 0
  gaps_out = 0
  border_size = 0
}

debug {
  disable_logs = false
  vfr = true # it’ll lower the amount of sent frames when nothing is happening on-screen
}

decoration {
  blur {
    enabled = false
  }
  inactive_opacity = 0.80
}

# pi4: animations off; the V3D GPU is modest
animations {
  enabled = false
}

input {
  repeat_delay = 200
  sensitivity = 1.0
  natural_scroll = true

  touchpad {
    natural_scroll = true
  }
}

misc {
  disable_hyprland_logo = true
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

xwayland {
  force_zero_scaling = true
}

# pi4: no GDK_SCALE=2 (that's for the laptop's HiDPI panel)
# env = GDK_SCALE,2
env = XCURSOR_SIZE,24
env = XDG_SESSION_DESKTOP,Hyprland

$mainMod = SUPER

# pi4: foot instead of alacritty/ghostty (both slow to cross-build); SUPER+Return added
bind = $mainMod, Q, exec, foot
bind = $mainMod SHIFT, Q, exec, foot
bind = $mainMod, Return, exec, foot
# bind = $mainMod, Q, exec, alacritty
# bind = $mainMod SHIFT, Q, exec, ghostty
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
# pi4: dolphin and wofi aren't in the image yet (add them via `make pi4-deploy`)
# bind = $mainMod, E, exec, dolphin
# bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, R, exec, foot -e nmtui
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, workspace, e-1
bind = $mainMod, l, workspace, e+1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# pi4: volumectl/lightctl (laptop media keys) aren't on the Pi; no backlight on HDMI
# bind = , XF86AudioRaiseVolume, exec, volumectl -u up
# bind = , XF86AudioLowerVolume, exec, volumectl -u down
# bind = , XF86AudioMute, exec, volumectl toggle-mute
# bind = , XF86AudioMicMute, exec, volumectl -m toggle-mute
# bind = , XF86MonBrightnessUp, exec, lightctl up
# bind = , XF86MonBrightnessDown, exec, lightctl down

# pi4: start.sh (awww, nm-applet, ironbar, mako) and `sd` aren't in the image yet
# exec-once = sd activation systemd-reset-services && timedatectl set-ntp true
# exec-once = bash ~/.config/hypr/start.sh
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = foot
