gui:
  expandFocusedSidePanel: true
  scrollHeight: 10
  scrollOffBehavior: "jump"
  sidePanelWidth: 0.25
  nerdFontsVersion: "3" # nerd fonts version to use ("2" or "3"); empty means don't show nerd font icons
  border: "single" # one of 'single' | 'double' | 'rounded' | 'hidden'
  # A partly staged file shows its unstaged and staged diffs stacked, each full width (the default
  # 'flexible' puts them side by side on wide windows, cramped with the side-by-side pager).
  mainPanelSplitMode: vertical
  # parrots-of-paradise (static/parrots-of-paradise.yaml), the palette nvim, tuicr and neogit use.
  theme:
    activeBorderColor: ["#EFAA32", "bold"] # base09
    inactiveBorderColor: ["#5E6E5E"] # base03
    searchingActiveBorderColor: ["#FFD580", "bold"] # base0A
    optionsTextColor: ["#85B1DD"] # base0D
    selectedLineBgColor: ["#10302b"] # base02
    inactiveViewSelectedLineBgColor: ["bold"]
    cherryPickedCommitFgColor: ["#85B1DD"] # base0D
    cherryPickedCommitBgColor: ["#10302b"] # base02
    markedBaseCommitFgColor: ["#FFD580"] # base0A
    markedBaseCommitBgColor: ["#10302b"] # base02
    unstagedChangesColor: ["#EF5D32"] # base08
    defaultFgColor: ["#D6E3C6"] # base05
git:
  # `|` cycles these in the diff view. The delta pagers keep the [delta] look from git config
  # (file headers, line numbers, word-level highlights). No --width: lazygit runs the pager in a pty
  # the size of the panel, so delta fits it ({{columnWidth}} is ydiff's half-width, too narrow).
  pagers:
    # 1. side-by-side (GitHub "split" view): long lines wrap inside each column, so line numbers stay
    #    aligned. Roomier with the side panel collapsed (+ / _). Line numbers are links to $EDITOR.
    - colorArg: always
      pager: >-
        delta --dark --paging=never --side-by-side --line-numbers
        --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    # 2. unified, for narrow terminals (lazygit itself wraps long lines here, without line numbers)
    - colorArg: always
      pager: >-
        delta --dark --paging=never --line-numbers
        --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    # 3. difftastic: syntax-aware diff, ignores reformatting and shows what actually changed
    - externalDiffCommand: difft --color=always
  # NOTE: previous single pager:
  # pagers:
  #   - # useConfig: true # maybe this can finish it
  #     colorArg: always
  #     # useConfig: true
  #     pager: delta --dark --paging=never
  parseEmoji: true
refresher:
  refreshInterval: 6 # File/submodule refresh interval in seconds. Auto-refresh can be disabled via option 'git.autoRefresh'.
keybinding:
  universal:
    quit: "q" # exists the program
    quit-alt1: "<c-c>" # alternative/alias of quit
    return: "<esc>" # exit prompt, also acts as return to previous menu
    # <c-d>/<c-u> and J/K are lazygit's defaults for scrolling the diff from the side panels again,
    # and n/N its search next/previous match (they were next/previous panel, which is why n/N
    # "sometimes didn't work" in the staged/unstaged views). Panels: <tab>/<backtab>, h, arrows, 1-5.
    # List paging is lazygit's default , and .
    # prevPage: "<c-u>" # go to next page in list
    # nextPage: "<c-d>" # go to previous page in list
    # prevBlock: "N" # goto the previous block / panel
    # nextBlock: "n" # goto the next block / panel
    scrollRight: "<c-l>" # scroll right within list view
    gotoTop: "g" # go to top of list
    gotoBottom: "G" # go to bottom of list
    select: "<space>"
    goInto: "l"
    copyToClipboard: "y"
    # Range select: lazygit's `v` toggle or <s-up>/<s-down> (J/K now scroll the diff).
    # rangeSelectUp: "K"
    # rangeSelectDown: "J"
    increaseContextInDiffView: <c-k>
    decreaseContextInDiffView: <c-j>
  files:
    openStatusFilter: "s"
    viewStashOptions: "<c-s>"
  stash:
    popStash: "p"
    # stash pop
customCommands:
  # R in the files panel: review the changes in tuicr (`cr`); `y` there sends your comments to the
  # Claude Code pane for this repo, `:q` comes back. R stays refresh / rename in the other panels.
  - key: "R"
    context: "files"
    command: cr
    output: terminal
    description: "Review changes in tuicr (y sends comments to Claude)"
  # - key: "<c-z>"
  #   context: "files"
  #   command: 'echo "IM amazing"'
